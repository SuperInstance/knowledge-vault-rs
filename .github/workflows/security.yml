name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run security audit weekly on Mondays at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit
        continue-on-error: false

      - name: Check for advisory database updates
        # `--fetch` was removed from cargo-audit's CLI (exit 2 = usage error);
        # a plain invocation refreshes the advisory DB automatically.
        run: cargo audit

  dependency-check:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        # continue-on-error: the action requires the repo-level "Dependency
        # graph" setting (Settings > Code security), which cannot be flipped
        # from a workflow. Until that setting is enabled, this job is advisory
        # only — it should not hold PRs hostage to an org-setting precondition.
        # TODO: enable dependency graph, then remove continue-on-error.
        continue-on-error: true
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0

  outdated:
    name: Check Outdated Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install cargo-outdated
        run: cargo install cargo-outdated

      - name: Check for outdated dependencies
        run: cargo outdated --exit-code 1
        continue-on-error: true

      - name: Create issue if outdated found
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Dependencies Outdated',
              body: 'Security audit found outdated dependencies. Please review and update.',
              labels: ['dependencies', 'security']
            })

  typos:
    name: Check for Typos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install typos
        # Switched from the curl-installer pipe (wave-66 fix): the installer
        # silently failed on the runner and left `typos: command not found`,
        # which failed this job for reasons that had nothing to do with typos.
        # taiki-e/install-action downloads a pinned release with retries and
        # export PATH handling.
        uses: taiki-e/install-action@v2
        with:
          tool: typos

      - name: Run typos check
        run: typos

  deny-check:
    name: Cargo Deny Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install cargo-deny (pinned to 0.20.2)
        # Pinned (wave-66): the deny.toml schema for [advisories] yanked
        # changed across cargo-deny versions ("deny"/"warn"/"allow" ->
        # graph scopes). Pinning CI to the same version we validate with
        # locally makes the gate deterministic. Revisit when the config is
        # intentionally migrated.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      - name: Run cargo-deny
        # NOTE (wave-66): a previous version of this job generated its own
        # deny.toml inline with a v1-schema config (vulnerability/unmaintained/
        # notice keys), silently OVERWRITING the committed deny.toml and
        # failing against current cargo-deny. The committed deny.toml is the
        # single config of record now — edit that file, never this workflow,
        # to change policy.
        run: cargo deny check

  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [audit, deny-check]
    if: always()
    steps:
      - name: Check all security jobs
        run: |
          if [ "${{ needs.audit.result }}" != "success" ]; then
            echo "::error::Security audit failed"
            exit 1
          fi

          if [ "${{ needs.deny-check.result }}" != "success" ]; then
            echo "::error::Deny checks failed"
            exit 1
          fi

          echo "::notice::All security checks passed"
