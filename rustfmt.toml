# Rust formatting configuration
#
# Simplified 2026-09-30 (wave-66): the previous config mixed STABLE options
# with NIGHTLY-ONLY options (wrap_comments, format_strings,
# imports_granularity, group_imports, trailing_comma = "Vertical", ...).
# Consequence: `cargo fmt --check` produced different answers on the stable
# CI lanes vs the nightly lane (stable ignores unknown keys and warns;
# nightly honors them), so the fmt gate could never agree with itself across
# the matrix. This file now contains ONLY stable-channel options so every
# lane formats identically. Re-add nightly options only together with a
# pinned nightly fmt job.

max_width = 100
hard_tabs = false
tab_spaces = 4
use_small_heuristics = "Default"
newline_style = "Unix"
use_field_init_shorthand = true
reorder_imports = true
reorder_modules = true
use_try_shorthand = true
